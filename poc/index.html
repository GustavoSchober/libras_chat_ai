<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LIBRAS AI CHAT — POC</title>
<style>
  :root { --bg:#0f1115; --fg:#e6e8ec; --mut:#8b93a1; --ok:#3ddc84; --warn:#ffb020; --acc:#4c8dff; }
  * { box-sizing:border-box }
  body { margin:0; font:15px/1.5 system-ui,sans-serif; background:var(--bg); color:var(--fg);
         display:grid; grid-template-columns:420px 1fr; height:100vh }
  @media (max-width:860px){ body{grid-template-columns:1fr; height:auto} }
  #palco { background:#fff; border-right:1px solid #222 }
  #palco iframe { width:100%; height:100%; min-height:420px; border:0; display:block }
  main { padding:20px; overflow:auto }
  h1 { font-size:17px; margin:0 0 4px }
  .sub { color:var(--mut); font-size:13px; margin-bottom:16px }
  textarea { width:100%; min-height:72px; background:#161922; color:var(--fg);
             border:1px solid #2a2f3a; border-radius:8px; padding:10px; font:inherit; resize:vertical }
  .row { display:flex; gap:8px; flex-wrap:wrap; margin:10px 0 }
  button { background:var(--acc); color:#fff; border:0; border-radius:8px;
           padding:8px 14px; font:inherit; cursor:pointer }
  button.sec { background:#262b36; color:var(--fg) }
  button:disabled { opacity:.4; cursor:default }
  .glosa { display:flex; gap:6px; flex-wrap:wrap; margin:14px 0 }
  .tok { padding:5px 10px; border-radius:6px; background:#1b1f2a; border:1px solid #2a2f3a; font-size:13px }
  .tok.ok { border-color:#24593c }
  .tok.warn { border-color:#6b4a0d; color:var(--warn) }
  .tok.now { background:var(--acc); border-color:var(--acc); color:#fff }
  .tok.incerto { border-style:dashed; border-color:var(--warn) }
  button.sec.on { outline:2px solid var(--acc) }
  .motor { font-size:12px; color:var(--mut); margin-top:6px }
  .alerta { background:#3a1114; border:1px solid #ff4d5e; color:#ffd7db; padding:10px 12px;
            border-radius:8px; margin:0 0 14px; font-size:14px }
  .alerta code { background:#00000055; padding:1px 5px; border-radius:4px }
  .iaok { color:var(--ok); font-size:12px; margin:0 0 10px }
  .legenda { color:var(--mut); font-size:12px }
  pre#log { background:#0a0c10; color:#5d6b7a; font:11px/1.45 ui-monospace,monospace;
            padding:10px; border-radius:8px; height:150px; overflow:auto; white-space:pre-wrap; margin-top:16px }
</style>
</head>
<body>

<div id="palco">
  <iframe id="player" title="Avatar VLibras"
          src="https://vlibras.gov.br/app/unity/index.html"
          sandbox="allow-scripts allow-same-origin"></iframe>
</div>

<main>
  <div id="alerta" class="alerta" hidden></div>
  <div id="iaok" class="iaok" hidden>● IA ligada (Jev)</div>
  <h1>LIBRAS AI CHAT — prova de conceito</h1>
  <div class="sub">Digite uma frase. O avatar sinaliza. Tokens em
    <span style="color:var(--warn)">amarelo</span> não existem no acervo e serão soletrados;
    com <span style="border:1px dashed var(--warn);padding:0 4px;border-radius:4px">borda tracejada</span>,
    a IA não teve certeza do sinal.</div>

  <textarea id="txt">o rato roeu a roupa do rei de roma</textarea>

  <div class="row">
    <button id="bSinalizar" disabled>Sinalizar</button>
    <button class="sec" id="bRepetir">Repetir</button>
    <button class="sec" id="bPausar">Pausar</button>
    <button class="sec" id="bParar">Parar</button>
    <button class="sec vel" data-v="1">1×</button>
    <button class="sec vel" data-v="1.5">1,5×</button>
    <button class="sec vel" data-v="2">2×</button>
  </div>

  <div id="glosa" class="glosa"></div>
  <div id="legenda" class="legenda"></div>
  <div id="motor" class="motor"></div>

  <pre id="log"></pre>
</main>

<script>
// ─── configuração ────────────────────────────────────────────────────────────
const BASE_BUNDLES = 'https://dicionario2.vlibras.gov.br/static/BUNDLES/2018.3.1/WEBGL/BR/';
const ENDPOINTS = [
  'https://traducao2.vlibras.gov.br/translate',
  'https://traducao2-dth.vlibras.gov.br/translate',
];

const fr  = document.getElementById('player');
const log = (...a) => { const el = document.getElementById('log');
  el.textContent += a.join(' ') + '\n'; el.scrollTop = el.scrollHeight; };

// ─── ponte com o player Unity ────────────────────────────────────────────────
const send = (object, method, params) =>
  fr.contentWindow.postMessage({ type:'unity', object, method, params }, '*');

let pronto = false, tokens = [], degradado = false, atual = 0;

window.addEventListener('message', e => {
  const d = e.data;
  if (!d || d.type !== 'unity_event') return;

  if (d.event === 'on_load_player') {
    pronto = true;
    // OBRIGATÓRIO: sem isto o player não sabe de onde baixar os sinais.
    send('PlayerManager', 'setBaseUrl', BASE_BUNDLES);
    aplicarVelocidade(velocidade);
    document.getElementById('bSinalizar').disabled = false;
    log('player pronto');
  }

  if (d.event === 'counter_gloss') {
    // [n, total] chega quando o sinal n TERMINA (medido: com 1 sinal, [1,1] chega junto
    // com o fim da reprodução). O que está sendo sinalizado agora é o índice n (0-based).
    const [n, total] = d.data;
    if (total) { atual = n; destacar(n < total ? n : -1); }
  }
  // logo depois do playNow o player emite isPlaying=False antes do True: não limpe ali.
  if (d.event === 'on_playing_state_change' && d.data?.[0] === 'True') destacar(atual);

  if (d.event !== 'update_progress' && d.event !== 'counter_gloss')
    log(d.event, JSON.stringify(d.data ?? ''));
});

// ─── a IA está ligada? ───────────────────────────────────────────────────────
// Sem o servidor do projeto a página cai para o tradutor do governo, que erra feio
// (RATO ROEDOR..., negação perdida). Isso NÃO pode acontecer em silêncio.
const URL_CERTA = 'http://127.0.0.1:8765/poc/';  // suba com: npm run dev
const COMO_LIGAR = `Rode <code>npm run dev</code> na pasta do projeto e use <a style="color:#fff" href="${URL_CERTA}">${URL_CERTA}</a>.`;
function alertar(html) {
  const el = document.getElementById('alerta');
  el.innerHTML = html || ''; el.hidden = !html;
  document.getElementById('iaok').hidden = !!html;
}
async function checarIA() {
  if (location.protocol === 'file:')
    return alertar('⛔ <b>IA DESLIGADA</b> — a página foi aberta como arquivo. ' + COMO_LIGAR);
  try {
    const r = await fetch('/api/saude', { cache: 'no-store' });
    const j = await r.json();
    alertar(j.ok ? '' : '⛔ <b>IA DESLIGADA</b> — ' + j.erro + '. Confira a chave no <code>.env.local</code>.');
  } catch (_) {
    alertar('⛔ <b>IA DESLIGADA</b> — esta página não está sendo servida pelo servidor do projeto. ' +
            COMO_LIGAR + ' Enquanto isso, as frases vão para o tradutor do governo, que erra ' +
            '(ex.: <code>RATO ROEDOR</code>, negação perdida).');
  }
}
checarIA();

// ─── motor principal: o Jev escolhe os sinais, o código monta (ia/servidor.py) ──
// Os SINAIS continuam vindo do acervo do governo (dicionario2.vlibras.gov.br); o que muda
// é quem decide QUAIS sinais. Se o servidor não responder, cai para o tradutor do governo.
async function glosarComJev(texto) {
  const ctl = new AbortController();
  const t = setTimeout(() => ctl.abort(), 5000);
  try {
    const r = await fetch('/api/glosa', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ texto }), signal: ctl.signal,
    });
    if (!r.ok) throw new Error('HTTP ' + r.status + ' ' + (await r.text()).slice(0, 200));
    return await r.json();
  } catch (e) {
    log('motor Jev indisponível (' + e.message + ') — usando o tradutor do governo');
    return null;
  } finally { clearTimeout(t); }
}

// ─── tradução com fallback (a API de produção cai de vez em quando) ──────────
async function traduzir(texto) {
  for (let tentativa = 0; tentativa < 3; tentativa++) {
    for (const ep of ENDPOINTS) {
      try {
        const r = await fetch(ep, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text: texto }),
        });
        if (r.ok) return (await r.text()).trim();   // text/plain, não JSON
      } catch (_) { /* tenta o próximo */ }
    }
    await new Promise(r => setTimeout(r, 1200));
  }
  log('tradução falhou — modo degradado');
  degradado = true;
  // NÃO devolvemos o texto cru em maiúsculas: palavras como GOSTO casam por acidente
  // com um sinal de OUTRO sentido (o substantivo "sabor") e o avatar erra com confiança.
  // Tiramos ao menos as palavras funcionais, que nunca viram sinal em Libras.
  return texto.toUpperCase().split(/\s+/).filter(p => p && !VAZIAS.has(p)).join(' ');
}

// existem em português, mas não são sinalizadas em Libras
const VAZIAS = new Set(['DE','DA','DO','DAS','DOS','A','O','AS','OS','UM','UMA','UNS','UMAS',
  'EM','NO','NA','NOS','NAS','AO','À','PARA','PRA','POR','COM','QUE','E','É','SE','SEU','SUA']);

// ─── validação contra o acervo ───────────────────────────────────────────────
let BUNDLES = null;
fetch('../dados/bundles.json')
  .then(r => r.json())
  .then(b => { BUNDLES = new Set(b); log('acervo carregado:', b.length, 'glosas'); })
  .catch(() => log('acervo não carregado — validação desligada'));

function validar(glosa) {
  return glosa.split(/\s+/).filter(Boolean).map(tok => {
    if (!BUNDLES) return { tok, ok:true };
    if (BUNDLES.has(tok)) return { tok, ok:true };

    // 1S_IR_2S -> IR  (direcional que o tradutor inventou)
    const dir = tok.match(/^[123][SP]_(.+?)_[123][SP]$/);
    if (dir && BUNDLES.has(dir[1]))
      return { tok: dir[1], ok:true, nota:`${tok} não existe; usando ${dir[1]}` };

    // COMPRAR&DINHEIRO -> COMPRAR
    const base = tok.split('&')[0];
    if (BUNDLES.has(base))
      return { tok: base, ok:true, nota:`${tok} não existe; usando ${base}` };

    return { tok, ok:false, nota:`${tok} será soletrado` };
  });
}

// ─── heurísticas que pegam erro SEM precisar de IA ───────────────────────
const NEGACOES = /\b(não|nao|nunca|jamais|nenhum|nenhuma|nada|ninguém|ninguem)\b/i;

function auditar(texto, itens) {
  const avisos = [];
  const toks = itens.map(i => i.tok);

  // 1) negação que sumiu  ("eu não gosto" -> GOSTAR)
  if (NEGACOES.test(texto) && !toks.some(t => /^(NÃO|NUNCA|NADA|NENHUM)/.test(t)))
    avisos.push('⚠ a frase tem negação, mas a glosa não — o sinal pode dizer o contrário');

  // 2) colapso: a glosa encolheu demais  ("o gato roeu..." -> GATO ROMA ROMA)
  const palavras = texto.split(/\s+/).filter(p => p.length > 2).length;
  if (palavras >= 5 && toks.length < palavras / 2)
    avisos.push('⚠ a tradução encolheu muito — pode ter perdido palavras');

  // 3) token repetido em sequência: sintoma clássico do colapso
  for (let i = 1; i < toks.length; i++)
    if (toks[i] === toks[i - 1]) {
      avisos.push(`⚠ "${toks[i]}" apareceu repetido — sinal de tradução quebrada`);
      break;
    }

  // 4) entrada sem acento: causa comum de sinal faltando
  if (itens.some(i => !i.ok) && !/[áàâãéêíóôõúç]/i.test(texto))
    avisos.push('⚠ o texto não tem acentos — acentuar costuma resolver');

  return avisos;
}

function destacar(i) {
  document.querySelectorAll('.tok').forEach((el, k) => el.classList.toggle('now', k === i));
}

function pintar(itens, info = {}) {
  const el = document.getElementById('glosa');
  el.innerHTML = '';
  itens.forEach(it => {
    const d = document.createElement('span');
    d.className = 'tok ' + (it.ok ? 'ok' : 'warn') + (it.incerto ? ' incerto' : '');
    d.textContent = it.tok;
    const dica = [];
    if (it.palavra && it.palavra !== it.tok) dica.push('“' + it.palavra + '”');
    if (it.confianca != null) dica.push('confiança ' + it.confianca.toFixed(2));
    if (it.alternativas) dica.push('alternativas: ' +
      it.alternativas.map(([g, p]) => g + ' ' + p.toFixed(2)).join(', '));
    if (it.nota) dica.push(it.nota);
    if (dica.length) d.title = dica.join(' · ');
    el.appendChild(d);
  });
  const notas = itens.filter(i => i.nota).map(i => i.nota);
  const texto = document.getElementById('txt').value.trim();
  // as heurísticas de colapso são para a saída do tradutor do governo
  const avisos = info.motor === 'vlibras' ? auditar(texto, itens) : [];
  if (itens.some(i => i.incerto)) avisos.push(
    '⚠ a IA não teve certeza de algum sinal (borda tracejada) — passe o mouse para ver as alternativas');
  if (degradado) avisos.unshift(
    '⛔ O tradutor está fora do ar. Isto NÃO é Libras — é soletração palavra a palavra, ' +
    'e algum sinal pode sair com outro sentido. Não use para aprender.');
  const el2 = document.getElementById('legenda');
  el2.innerHTML = '';
  avisos.forEach(a => {
    const d = document.createElement('div');
    d.style.color = 'var(--warn)';
    d.textContent = a;
    el2.appendChild(d);
  });
  if (info.descartadas?.length) notas.push(...info.descartadas.map(d => d.nota));
  if (notas.length) {
    const d = document.createElement('div');
    d.textContent = notas.join(' · ');
    el2.appendChild(d);
  }
  document.getElementById('motor').textContent = info.motor === 'vlibras'
    ? 'motor: tradutor do governo (reserva)'
    : `motor: Jev (${info.modelo}) · ${info.ms} ms` +
      (info.emocao ? ` · expressão: ${info.emocao.emocao}` : '');
}

// ─── ações ───────────────────────────────────────────────────────────────────
async function sinalizar() {
  const texto = document.getElementById('txt').value.trim();
  if (!texto || !pronto) return;
  degradado = false;
  let itens, info = await glosarComJev(texto);
  if (info) {
    itens = info.itens;                       // já validados no servidor
    log(`glosa (Jev, ${info.ms} ms):`, info.glosa);
    alertar('');
  } else {
    alertar('⛔ <b>IA DESLIGADA — esta tradução é do tradutor do governo</b>, sem a correção ' +
            'da IA. Ela erra (ex.: <code>RATO ROEDOR</code>, negação perdida). ' + COMO_LIGAR);
    const glosa = await traduzir(texto);
    log('glosa (governo):', glosa);
    itens = validar(glosa);
    info = { motor: 'vlibras' };
  }
  pintar(itens, info);
  tokens = itens.map(i => i.tok);
  // um playNow durante uma reprodução em curso é ignorado: pare antes.
  send('PlayerManager', 'stopAll', '');
  const e = info.emocao;
  send('EmotionBridge', e ? e.metodo : 'ApplyDefaultEmotion', e ? Number(e.intensidade) : 2);
  atual = 0;
  setTimeout(() => send('PlayerManager', 'playNow', tokens.join(' ')), 150);
}

document.getElementById('bSinalizar').onclick = sinalizar;
document.getElementById('bRepetir').onclick = () => {
  if (!tokens.length) return;
  send('PlayerManager','stopAll','');
  atual = 0;
  setTimeout(() => send('PlayerManager','playNow',tokens.join(' ')), 150);
};
document.getElementById('bPausar').onclick  = () => send('PlayerManager','setPauseState','1');
document.getElementById('bParar').onclick   = () => send('PlayerManager','stopAll','');
// ─── velocidade ──────────────────────────────────────────────────────────────
// ⚠ setSlider precisa de NÚMERO. Com string ('1.5') o Unity ignora em silêncio —
// por isso os botões antigos ('0.6', '1') nunca funcionaram. Medido em 2026-11-09:
// 5 sinais levam 16,4 s em 1×, 11,5 s em 1,5× e 8 s em 2×.
let velocidade = 1.5;
try { velocidade = Number(localStorage.getItem('velocidade')) || 1.5; } catch (_) {}
function aplicarVelocidade(v) {
  velocidade = v;
  send('PlayerManager', 'setSlider', v);
  try { localStorage.setItem('velocidade', String(v)); } catch (_) {}
  document.querySelectorAll('button.vel').forEach(b =>
    b.classList.toggle('on', Number(b.dataset.v) === v));
}
document.querySelectorAll('button.vel').forEach(b =>
  b.onclick = () => aplicarVelocidade(Number(b.dataset.v)));

document.getElementById('txt').addEventListener('keydown', e => {
  if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) sinalizar();
});

log('carregando player (~20 MB na primeira vez)…');
</script>
</body>
</html>
