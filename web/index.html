<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Libras AI Chat</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <meta name="description" content="Escreva uma frase em português e veja um avatar 3D sinalizá-la em Libras, sinal por sinal.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap">
  <link rel="preconnect" href="https://vlibras.gov.br">
  <script>
    // tema antes do primeiro pintar, sem piscar: escolha salva > preferência do sistema
    try { document.documentElement.dataset.tema = localStorage.getItem('tema')
      || (matchMedia('(prefers-color-scheme: dark)').matches ? 'escuro' : 'claro') } catch (_) {}
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
